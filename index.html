<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
      charset="utf-8"
    >
  </head>
  <body class="main-page">
    <section class="main-page__eisenhower-matrix">
      <img
        class="main-page__eisenhower-matrix__img"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower Matrix"
      >
      <a
        class="main-page__eisenhower-matrix__more-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </section>
    <section class="task-list">
      <section class="task-list__add-new-task">
        <p class="task-list__add-new-task__header">
          <h3 
            class="task-list__add-new-task__header__label"
            for="new-task-input"
          >
          Add Item
          </h3>
          <div class="task-list__add-new-task__input-wrapper">
            <input
              id="new-task-input"
              class="task-list__add-new-task__text-input"
              type="text"
            >
            <button id="add-button" class="task-list__add-new-task__add-button">Add</button>
          </div>
        </p>
      </section>
      <section class="task-list__incomplete-tasks__wrapper">
        <h3 class="task-list__section-title">Todo</h3>
        <ul id="incomplete-tasks" class="task-list__sub-task-list">
          <li class="task-list__sub-task-list__task-list-item">
            <input
              class="task-list__sub-task-list__task-list-item__checkbox-input"
              type="checkbox"
            >
            <label class="task-list__sub-task-list__task-list-item__label">Pay Bills</label>
            <input
              class="task-list__sub-task-list__task-list-item__text-input"
              name="incomplete-task"
              type="text"
            >
            <button class="edit">Edit</button>
            <button class="delete">
              <img class="delete__img" src="./remove.svg" alt="delete icon">
            </button>
          </li>
          <li class="task-list__sub-task-list__task-list-item edit-mode">
            <input
              name="incomplete-task"
              class="checkbox-input"
              type="checkbox"
            >
            <label class="task-list__sub-task-list__task-list-item__label">Go Shopping</label>
            <input
              name="incomplete-task-input"
              type="text"
              value="Go Shopping"
              class="task-list__sub-task-list__task-list-item__text-input"
            >
            <button class="edit">Save</button>
            <button class="delete">
              <img class="delete__img" src="./remove.svg" alt="delete icon">
            </button>
          </li>
        </ul>
      </section>
      <section class="task-list__completed-tasks__wrapper">
        <h3 class="task-list__section-title">Completed</h3>
        <ul id="completed-tasks" class="task-list__sub-task-list">
          <li class="task-list__sub-task-list__task-list-item">
            <input 
              class="task-list__sub-task-list__task-list-item__checkbox-input"
              type="checkbox"
              checked
            >
            <label class="task-list__sub-task-list__task-list-item__label">See the Doctor</label>
            <input
              class="task-list__sub-task-list__task-list-item__text-input"
              name="completed-task"
              type="text"
            >
            <button class="edit">Edit</button>
            <button class="delete">
              <img class="delete__img" src="./remove.svg" alt="delete icon">
            </button>
          </li>
        </ul>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
